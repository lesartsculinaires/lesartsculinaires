name: Deploy Supabase migrations

# Sólo manual, a propósito.
#
# Corría automáticamente en cada push a main que tocara supabase/migrations/**,
# pero `supabase db push` aplicaría también 20260722000000_initial_schema.sql
# —el esquema de recetas heredado, que no tiene relación con el CRM— y crearía
# siete tablas ajenas en la base de producción. Las migraciones del CRM ya están
# aplicadas y sus nombres de archivo coinciden con lo registrado en
# supabase_migrations, así que un push las ve como hechas.
#
# Antes de volver a activarlo en automático: borrá esa migración heredada (o
# marcala como aplicada) y confirmá que los tres secrets estén cargados.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

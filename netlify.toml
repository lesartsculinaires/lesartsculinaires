# Configuración de despliegue en Netlify.
#
# El runtime de Next.js de Netlify se encarga de los Server Components, el
# middleware (como edge function) y las Server Actions. No hay que fijar
# `output` en next.config.ts: el plugin arma el bundle por su cuenta.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Fijar la mayor de Node evita que un cambio del default de Netlify
  # rompa el build sin que nadie haya tocado el repo.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ------------------------------------------------- mantener despierto Supabase
#
# El proyecto de Supabase se enfría sin uso y la primera petición después de un
# rato tarda entre diez y quince segundos —medido: 11,3 s en auth y 15,9 s en
# rest, contra 230 ms en caliente—. El código ya aprendió a no morirse
# esperando, pero eso hace que el CRM falle bien, no que ande rápido.
#
# Cada dos minutos, de afuera. De afuera porque `pg_cron` vive adentro de la
# base: si el cómputo está dormido, el cron también, y nada que viva adentro
# puede despertar a quien lo aloja.
#
# El horario va acá y no en el código para no agregar `@netlify/functions` como
# dependencia sólo por una línea.
#
# EMPEZÓ EN CINCO Y SE BAJÓ A DOS. Supabase no publica cada cuánto duerme el
# cómputo, así que el número no se puede deducir: se elige y se mira. Dos
# minutos deja un margen cómodo contra cualquier plazo de inactividad razonable,
# y lo que cuesta es despreciable —unos 21.600 llamados al mes, sobre los 125.000
# que entran en el plan gratuito de Netlify, y cada uno de décimas de segundo
# contra una base que ya está despierta—.
#
# Si aun así en los registros de la función aparecen pings de varios segundos,
# es que se enfrió entre uno y otro y el plazo de Supabase es más corto de lo
# que cualquiera esperaría: ahí conviene revisar el plan antes que seguir
# bajando este número.
[functions."mantener-despierto"]
  schedule = "*/2 * * * *"

# ---------------------------------------------------------------- entornos
#
# `main` es lo que ve el equipo de ventas. Cualquier otra rama se publica en
# su propia dirección, para poder probar sin tocar la operación.
#
# Falta un paso que no se puede dejar escrito acá: en Netlify → Site
# configuration → Build & deploy → Branches, hay que habilitar el despliegue
# de ramas. Y en Environment variables, apuntar la rama de pruebas a un
# proyecto de Supabase aparte: si comparte base con producción, probar sigue
# significando escribir en los datos reales.

[context.production.environment]
  NEXT_PUBLIC_ENTORNO = "produccion"

[context.branch-deploy.environment]
  NEXT_PUBLIC_ENTORNO = "pruebas"

[context.deploy-preview.environment]
  NEXT_PUBLIC_ENTORNO = "pruebas"
